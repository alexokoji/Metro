[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev"
  port = 3000
[context.production]
  # Production API for Metro Cracks - update in Netlify dashboard if needed
  environment = { VITE_API_URL = "https://metro-dlxe.onrender.com/api" }